<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Quiz System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container"><span class="navbar-brand fw-bold">Online Quiz System</span></div>
  </nav>

  <main class="container py-5">
    <div class="text-center mb-4">
      <h1 class="fw-bold">Online Quiz</h1>
      <p class="text-muted">Test your knowledge with this simple college quiz.</p>
    </div>

    <form class="card shadow-sm p-4">
      <div class="mb-4">
        <h5>1. HTML stands for?</h5>
        <div class="form-check"><input class="form-check-input" type="radio" name="q1" id="q1a"><label class="form-check-label" for="q1a">Hyper Text Markup Language</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="q1" id="q1b"><label class="form-check-label" for="q1b">High Text Machine Language</label></div>
      </div>

      <div class="mb-4">
        <h5>2. CSS is mainly used for?</h5>
        <div class="form-check"><input class="form-check-input" type="radio" name="q2" id="q2a"><label class="form-check-label" for="q2a">Styling web pages</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="q2" id="q2b"><label class="form-check-label" for="q2b">Storing databases</label></div>
      </div>

      <div class="mb-4">
        <h5>3. Bootstrap is a?</h5>
        <div class="form-check"><input class="form-check-input" type="radio" name="q3" id="q3a"><label class="form-check-label" for="q3a">CSS framework</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="q3" id="q3b"><label class="form-check-label" for="q3b">Programming language</label></div>
      </div>

      <button type="submit" class="btn btn-primary">Submit Quiz</button>
    </form>
  </main>
</body>
</html>
